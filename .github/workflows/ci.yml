name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Gate de secretos: bloquea. Primera etapa, revisa todo el historial.
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Se usa el CLI y no gitleaks-action: en eventos push la action solo escanea
      # los commits del push, y un secreto de un commit anterior pasaba sin detectarse.
      - name: Instalar gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks

      - name: gitleaks sobre todo el historial
        run: ./gitleaks git . --redact --verbose

  # Gate de SCA: bloquea con vulnerabilidades high o critical en dependencias de producción.
  sca:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: npm audit (high/critical bloquea)
        run: npm audit --audit-level=high --omit=dev

  # Pruebas y gate de cobertura (80 % de líneas en jest.config.js): bloquea.
  test:
    name: Pruebas y cobertura
    needs: [secretos, sca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura
        run: npm test

  # Gate de SAST (extra): avisa. Publica alertas en Security sin bloquear el merge.
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - uses: github/codeql-action/analyze@v3
